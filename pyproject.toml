[project]
name = "image-studio"
version = "0.1.0"
description = "A personal image studio"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "alembic>=1.20,<2",
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "pillow>=12.3,<13",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.1.4,<3",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_studio"]
