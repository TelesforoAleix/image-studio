[project]
name = "image-studio"
version = "0.1.0"
description = "A personal image studio"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
